<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Authentification réussie</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { 
      background:#0b0c0e; 
      font-family:'Inter',sans-serif; 
      display:flex; 
      align-items:center; 
      justify-content:center; 
      height:100vh; 
      color: #e3e5e8;
    }
    .card { 
      background:#111317; 
      border:1px solid #2a2d35; 
      border-radius:18px; 
      padding:40px 48px; 
      text-align:center; 
      max-width:440px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .icon { font-size:60px; margin-bottom:20px; }
    h1 { color:#57f287; font-size:24px; margin-bottom:12px; }
    p { color:#72767d; font-size:15px; line-height:1.6; margin-bottom: 20px; }
    .badge { 
      display:inline-block; 
      background: rgba(87, 242, 135, 0.1); 
      border:1px solid #57f287; 
      color:#57f287; 
      border-radius:8px; 
      padding:8px 20px; 
      font-size:14px; 
      font-weight:600; 
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Vérification réussie !</h1>
    <p>Merci ! Ton compte a été vérifié et sauvegardé avec succès. Tu peux maintenant fermer cet onglet et retourner sur Discord.</p>
    <div class="badge">🛡️ Protection Active</div>
  </div>
</body>
</html>
